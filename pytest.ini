[pytest]
testpaths = tests
markers =
    unit: fast tests that need no real data
    integration: tests that run the model scripts end to end
filterwarnings =
    # NumPy 2.5 deprecates "array.shape = ..." and joblib still does that internally when it
    # loads a saved model. It is a notice from the library (not from our code) and harmless.
    # Only this exact message is hidden, any other warning is still shown.
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
